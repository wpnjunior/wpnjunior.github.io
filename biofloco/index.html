}

  --accent:#3fb8a5;--accent-ink:#0b1210;--warn:#e0a060;--bad:#ef7a72;--good:#7cc488;
  --s-livre:#262c29;--s-ok:#1f3d37;--s-alerta:#4a3a22;--s-bad:#4a2522;--moon:#a9b6ea;--c-od:#74c0fc;--c-temp:#ff922b;--c-ph:#b197fc;--c-sal:#3bc9db;--c-alc:#69db7c;--c-tan:#f783ac;--c-no2:#ffd43b;--c-no3:#a9e34b;--c-ss:#d4a373;--c-dur:#91a7ff;--c-ca:#ced4da;--c-mg:#b197fc;--c-k:#ffa94d;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614;--card:#1b201e;--ink:#e7ece9;--muted:#9aa5a0;--line:#2c3330;
  --accent:#3fb8a5;--accent-ink:#0b1210;--warn:#e0a060;--bad:#ef7a72;--good:#7cc488;
  --s-livre:#262c29;--s-ok:#1f3d37;--s-alerta:#4a3a22;--s-bad:#4a2522;--moon:#a9b6ea;--c-od:#74c0fc;--c-temp:#ff922b;--c-ph:#b197fc;--c-sal:#3bc9db;--c-alc:#69db7c;--c-tan:#f783ac;--c-no2:#ffd43b;--c-no3:#a9e34b;--c-ss:#d4a373;--c-dur:#91a7ff;--c-ca:#ced4da;--c-mg:#b197fc;--c-k:#ffa94d;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1000px;margin:0 auto}

nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:1000px;margin:0 auto;scrollbar-width:none}

main{max-width:1000px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{font-size:16px;margin:22px 0 10px;text-wrap:balance}
h2:first-child{margin-top:4px}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);min-width:0}

.kpi.ok{border-left:4px solid var(--good)} .kpi.warn{border-left:4px solid var(--warn);background:var(--s-alerta)} .kpi.bad{border-left:4px solid var(--bad);background:var(--s-bad)} .kpi.none{border-left:4px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}

.why{display:flex;flex-direction:column;gap:6px;margin-top:10px}

.why b.up{color:var(--good)} .why b.dn{color:var(--bad)} .why b.eq{color:var(--muted)}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.tbl input,.tbl select{font:inherit;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:100%;min-width:64px}
.scroll{overflow-x:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:9px;font:inherit;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.del{color:var(--bad)}
.btn:focus-visible,nav button:focus-visible,#sub button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--s-livre);color:var(--ink);white-space:nowrap}
.tag.ok{background:var(--s-ok)} .tag.w{background:var(--s-alerta)} .tag.bad{background:var(--s-bad)}
.muted{color:var(--muted);font-size:13px}
.empty{padding:18px;text-align:center;color:var(--muted)}
.banner{border-radius:10px;padding:10px 12px;font-size:14px}
.banner.w{background:var(--s-alerta)} .banner.bad{background:var(--s-bad)} .banner.ok{background:var(--s-ok)} .banner.moon{background:var(--s-livre);border-left:4px solid var(--moon)}
.banner small{display:block;color:var(--muted);margin-top:2px}
.stack{display:flex;flex-direction:column;gap:8px}
.two{display:grid;gap:12px;grid-template-columns:1fr}
.two>*{min-width:0}
@media (min-width:800px){.two{grid-template-columns:1fr 1fr}}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 32px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:0}
.dlghead{padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:650}
.dlgbody{padding:14px 16px;max-height:65vh;overflow:auto}
.dlgfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.f label{font-size:12px;color:var(--muted)}
.f input,.f select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.efeito{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0 4px;color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.busca{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:160px;min-width:0}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);z-index:20}
#toast ul{margin:4px 0 0;padding-left:18px}
.chart svg{display:block;width:100%;height:auto}
.moonrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:11px}
.moonrow div{padding:6px 2px;border-radius:8px;background:var(--bg)}
.moonrow div.hot{background:var(--s-alerta);font-weight:700}
.moonrow div.today{outline:2px solid var(--accent)}
.ev{font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;white-space:nowrap}
.ev.est{background:var(--s-ok)} .ev.camp{background:var(--s-alerta)}
.learn p{margin:6px 0;max-width:68ch}
.learn ul{margin:6px 0;padding-left:20px;max-width:68ch}
.ref{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* blocos de parâmetro: cor própria + animação guiada pelo número */
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.pt{--c:var(--accent);position:relative;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:10px 10px 12px;display:grid;grid-template-columns:1fr 56px;gap:4px 8px;align-items:start;min-width:0;overflow:hidden}
.pt .nm{font-size:12px;font-weight:700;color:var(--c);grid-column:1}
.pt .vl{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;grid-column:1;line-height:1.1}
.pt .vl small{font-size:11px;font-weight:500;color:var(--muted)}
.pt .viz{grid-column:2;grid-row:1/4;width:56px;height:64px}
.pt .viz svg{width:56px;height:64px;display:block;overflow:visible}
.pt .st{grid-column:1;font-size:11px}
.pt .sc{grid-column:1/3;position:relative;height:8px;border-radius:4px;background:var(--s-livre);margin-top:6px}
.pt .sc .zb{position:absolute;top:0;bottom:0;background:var(--c);opacity:.28;border-radius:4px}
.pt .sc .mk{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--c);left:0;transform:translateX(-50%);transition:left 1.1s cubic-bezier(.2,.8,.2,1)}
.pt .ft{grid-column:1/3;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.pt.aten{background:color-mix(in srgb,var(--card) 88%,var(--warn))}
.pt.crit{background:color-mix(in srgb,var(--card) 84%,var(--bad));animation:alarme 1.4s ease-in-out infinite}
.pt.none .vl{color:var(--muted)}
@keyframes alarme{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 0%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 45%,transparent)}}
@keyframes sobe{from{transform:translateY(0);opacity:.9}to{transform:translateY(-52px);opacity:0}}
@keyframes onda{from{transform:translateX(0)}to{transform:translateX(-28px)}}
@keyframes treme{0%,100%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}50%{transform:translate(-1px,1.5px)}75%{transform:translate(-1.5px,-.5px)}}
@keyframes cai{from{transform:translateY(-14px);opacity:0}30%{opacity:1}to{transform:translateY(0);opacity:1}}
@keyframes enche{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pt .bub{animation:sobe linear infinite}
.pt .wave{animation:onda linear infinite}
.pt .hz{animation:treme ease-in-out infinite}
.pt .dep{animation:cai ease-in infinite}
.pt .fill{transform-box:fill-box;transform-origin:bottom;animation:enche 1.1s cubic-bezier(.2,.8,.2,1) both}
.pt .ndl{transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.pt *,.pt{animation:none!important;transition:none!important}}

#cena{position:relative;max-width:1000px;margin:0 auto;padding:12px 16px 0;display:none}
#cena .wrap{position:relative;height:min(34vh,280px);border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(#bfe0ef,#e9f3ec)}
:root[data-theme="dark"] #cena .wrap{background:linear-gradient(#0d1b26,#16241d)}

<script>
(function(){
"use strict";
/* ===================== menus (mesma lógica do oProdutor) ===================== */
// Menu por uso no dia a dia. Cada tela guarda a chave antiga (grupo_tela) de T, para nada se perder; "#" é só um título na barra.

function alertasV14(out){const H=hoje(),V=tanque().vol;const L=k=>leituraRecente(k,H);
  /* minerais: proporção e correção */
  const ca=L("ca"),mg=L("mg"),k=L("k");
  if(mg&&ca){const r=mg.v/ca.v;if(r<2.5||r>4)out.push(["w",`Magnésio ÷ cálcio = ${f(r,1)} (ideal 2,5–4; no mar ≈ 3,1)`,"Fora da proporção a casca endurece mal depois da muda."])}
  if(mg&&k){const r=mg.v/k.v;if(r<2.5||r>4)out.push(["w",`Magnésio ÷ potássio = ${f(r,1)} (ideal 2,5–4; no mar ≈ 3,2)`,"Potássio baixo dá câimbra (camarão dobrado) e morte na muda."])}
  if(k&&k.v<ionAlvo("k")*0.8){const g=(ionAlvo("k")-k.v)*V/0.524;out.push(["w",`Potássio baixo: ${n0(k.v)} mg/L (alvo ≈ ${n0(ionAlvo("k"))})`,`Cloreto de potássio: ${n0(g)} g para chegar ao alvo. Dissolva e aplique em 2 ou 3 dias, longe da janela de muda.`])}
  if(mg&&mg.v<ionAlvo("mg")*0.8){const g=(ionAlvo("mg")-mg.v)*V/0.0986;out.push(["w",`Magnésio baixo: ${n0(mg.v)} mg/L (alvo ≈ ${n0(ionAlvo("mg"))})`,`Sulfato de magnésio (sal amargo, 7 H₂O): ${n0(g/1000)} kg para chegar ao alvo. Divida em 3 a 5 dias.`])}
  if(ca&&ca.v<ionAlvo("ca")*0.8)out.push(["w",`Cálcio baixo: ${n0(ca.v)} mg/L (alvo ≈ ${n0(ionAlvo("ca"))})`,"Líquido leitoso do gesso decantado (600 g por balde) ou cloreto de cálcio. Gesso traz cálcio, não alcalinidade."]);
  /* pH e CO2 */
  const phs=recs.filter(r=>r.tipo==="leitura"&&r.valores&&r.valores.ph!=null&&r.data.slice(0,10)===H).map(r=>({v:r.valores.ph,h:+(r.data.slice(11,13)||12)}));
  if(phs.length>=2){const mx=Math.max(...phs.map(x=>x.v)),mn=Math.min(...phs.map(x=>x.v));if(mx-mn>0.5)out.push(["w",`pH balançou ${f(mx-mn,1)} hoje (${f(mn,1)} a ${f(mx,1)})`,"Muita alga: ela tira CO₂ de dia e devolve à noite. Feche o sombrite nas horas de sol, mantenha o floco marrom e a alcalinidade ≥ 150 (segura o pH)."])}
  const cedo=phs.filter(x=>x.h<8).sort((a,b)=>a.v-b.v)[0];if(cedo&&cedo.v<7.4)out.push(["w",`pH ${f(cedo.v,1)} de madrugada: CO₂ alto`,"Respiração da noite acumula CO₂. Academia de ar agora e meça de novo às 9 h antes de pensar em cal; se a alcalinidade estiver boa, o pH sobe sozinho com o ar."]);
  /* OD supersaturado */
  const od=L("od");if(od&&od.v>9)out.push(["w",`OD ${f(od.v,1)} mg/L: acima do que o ar consegue (≈ 7 mg/L)`,"É fotossíntese de alga (água verde). À noite ela consome e o OD despenca. Feche o sombrite nas horas de sol e meça às 5–6 h."]);
  /* nitrato */
  const no3=L("no3");if(no3&&no3.v>300)out.push(["bad",`Nitrato ${n0(no3.v)} mg/L: dano crônico`,"Kuhn et al. 2010: em 6 semanas, sobrevivência 64% com 435 mg/L e 15% com 910. Troque parte da água (10–20%) com água preparada sem cloro."]);else if(no3&&no3.v>177)out.push(["w",`Nitrato ${n0(no3.v)} mg/L: acima do seguro (177)`,"Furtado et al. 2015 dão 177 mg/L como nível seguro. Em Kuhn et al. 2010, com 220 mg/L a sobrevivência ainda foi igual à do controle (87%), mas o peso final já foi menor (8,7 g contra 9,3 g). Planeje troca parcial."]);
  /* sólidos e sulfeto */
  const ss=L("ss");if(ss&&ss.v>30)out.push(["bad",`Cone ${f(ss.v,0)} mL/L: sólido demais`,"Ligue o decantador, Nutrat 2 mL por m³ e menos simbiótico. Acima de 30 vem brânquia preta, queda de OD e sulfeto no fundo."]);

 <tr><td><b>Nutrat</b><div class="muted">1 mL por m³, diluído em 2 L, 1 vez por dia. Dobrar se a espuma piorar.</div></td><td><b>${n0(cfg.doses.nutrat*tanque().vol)} mL</b> em 2 L (${f(cfg.doses.nutrat,1)} mL/m³)</td></tr>
 <tr><td><b>"Academia"</b><div class="muted">1 h de manhã com o ar no máximo. Menos nos dias de muda.</div></td><td>${jm.on?"<b>Dia de muda:</b> academia curta (30 min)":"<b>1 hora</b> de manhã"}</td></tr>
 <tr><td><b>Puim</b><div class="muted">Cerca de 10 g por 100 kg de biomassa por dia.</div></td><td><b>${f(L.biomKg/100*10,1)} g</b> (${f(L.biomKg,1)} kg de biomassa)</td></tr>

T.inicio_painel=()=>{
  const r=recomendacao(hoje());const L=r.L;const dc=diaCultivo();const al=alertas();const fs=fase(new Date());
  const trHoje=tratosDoDia(hoje());const dado=trHoje.reduce((s,x)=>s+(x.qtd||0),0);
  let h="";
  if(dc!=null&&dc<0&&dc>=-21)h+=`<div class="banner ok" style="margin-bottom:12px"><b>Preparo da água: dia ${dc+21} de 21</b><small>${aptoTxt()} · <a href="#" data-go="preparo.passos">Ver os passos de hoje</a></small></div>`;
  if(!cfg.dataPovoamento)h+=`<div class="banner w" style="margin-bottom:12px">Informe a data do povoamento em <a href="#" data-go="cadastro.tanque">Cadastro › Tanque e povoamento</a> para contar os dias de cultivo.</div>`;
  h+=`<div class="grid">${kpi(dc!=null&&dc<0?"Preparo da água":"Dia de cultivo",dc==null?"–":dc<0?"dia "+Math.max(0,dc+21)+" de 21":dc,cfg.dataPovoamento?(dc!=null&&dc>=0?"semana "+Math.floor(dc/7)+" · ":"povoar em ")+dt(cfg.dataPovoamento):"")}${kpi("Peso médio",f(L.peso,L.peso<1?3:2)+" g",biometriasAte(hoje())[0]?"estimado após biometria":"estimado")}${kpi("Vivos (est.)",n0(L.vivos),f(L.sobrev.s,0)+"% · "+n0(L.mortos)+" mortos contados")}${kpi("Biomassa",f(L.biomKg,L.biomKg<10?2:1)+" kg",f(L.biomKg/L.t.vol,2)+" kg/m³")}${kpi("Ração hoje",n0(dado)+" g","de "+n0(r.final)+" g · "+trHoje.length+"/"+r.nt+" tratos")}${kpi("Lua",fs.i+" <span style='font-size:15px'>"+fs.n+"</span>","dia "+f(fs.a,0)+" do ciclo lunar")}</div>`;
  h+=`<h2>Alertas</h2><div class="stack">${al.length?al.map(a=>`<div class="banner ${a[0]}">${a[0]==="moon"?"🌕 ":""}<b>${esc(a[1])}</b><small>${esc(a[2])}</small></div>`).join(""):`<div class="banner ok">Tudo dentro das faixas na última leitura${recs.some(x=>x.tipo==="leitura")?"":" (nenhuma leitura lançada ainda)"}.</div>`}</div>`;
  h+=`<h2>Ração de hoje e o porquê</h2>${recCard(r,"Recomendado para hoje, "+dt(hoje()))}<div class="row" style="margin-top:10px"><button class="btn p" type="button" data-go="manejo.racao">Lançar tratos de hoje</button></div>`;
  h+=`<h2>Ritual do dia (Só Bioflocos + camarão)</h2>${ritualHtml(hoje())}`;
  h+=`<h2>Quanto aplicar hoje</h2><div class="card scroll"><table class="tbl"><tr><th>Item</th><th class="r">Hoje</th><th>Como chegou</th></tr>${correcoes(hoje()).map(c=>`<tr><td>${esc(c[0])} <span class="ev ${c[3]==="estudo"?"est":"camp"}">${c[3]==="estudo"?"estudo":"campo"}</span></td><td class="r"><b>${esc(c[1])}</b></td><td class="muted">${esc(c[2])}</td></tr>`).join("")}</table></div>`;
  {const st=prep.decantador||{};const dec=decantadorAcao(hoje());h+=`<h2>Equipamentos</h2><div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><div style="min-width:0"><b>Decantador</b> <span class="tag ${st.on?"ok":""}">${st.on?"ligado desde "+new Date(st.desde).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"desligado"}</span>${dec?`<div class="muted"><b>${esc(dec.t)}</b>: ${esc(dec.p)}</div>`:`<div class="muted">Liga com cone acima de 15 mL/L, desliga em 10. Alerta com 3 dias seguidos ligado. Ligado: tirar o lodo do registro do cone todo dia.</div>`}</div><button type="button" class="btn ${st.on?"":"p"}" id="btnDec" style="flex:none">${st.on?"Desliguei":"Liguei"}</button></div></div>`}
  h+=`<h2>Última leitura de cada parâmetro</h2><div class="pgrid">${PARAMS.map(paramTile).join("")}</div>`;
  return h};

T.manejo_racao=()=>{
  const dia=racaoDia||hoje();const r=recomendacao(dia);const tr=tratosDoDia(dia);const n=Math.max(r.nt+extraTratos,tr.length);
  let restante=r.final,linhas="";
  for(let i=1;i<=n;i++){const ex=tr.find(x=>x.trato===i);const prev=tr.find(x=>x.trato===i-1);
    let sug=r.final/r.nt;let nota="";
    if(prev&&prev.bandeja==="Muita"){sug*=0.8;nota="−20%: muita sobra no trato anterior"}else if(prev&&prev.bandeja==="Vazia"){sug*=1.05;nota="+5%: bandeja anterior zerou"}
    if(r.trava===0){sug=0;nota="Suspenso pelo oxigênio"}
    linhas+=`<tr><td>${i}º</td><td><input type="time" data-h="${i}" value="${esc(ex?ex.hora||"":["06:00","10:00","14:00","18:00","22:00","02:00"][i-1]||"")}" aria-label="Hora do trato ${i}"></td>
      <td class="r">${n0(sug)} g${nota?`<div class="muted" style="font-size:11px">${esc(nota)}</div>`:""}</td>
      <td><input type="number" inputmode="decimal" step="any" data-q="${i}" value="${ex?ex.qtd:""}" placeholder="${n0(sug)}" aria-label="Ofertado no trato ${i}"></td>
      <td><select data-b="${i}" aria-label="Bandeja do trato ${i}">${opt([["","—"],["Vazia","Zerou"],["Pouca","Pouca sobra"],["Muita","Muita sobra"]],ex?ex.bandeja||"":"")}</select></td>
      <td style="text-align:center"><input type="checkbox" data-m="${i}" ${ex&&ex.muda?"checked":""} aria-label="Muda no trato ${i}" style="width:auto;min-width:0"></td></tr>`}
  const dado=tr.reduce((s,x)=>s+(x.qtd||0),0);
  return `<h2>Digitação de Ração</h2>
   <div class="row"><label class="muted" for="rDia">Dia</label><input id="rDia" type="date" value="${dia}" class="busca" style="width:auto"><button class="btn sm" type="button" data-rdia="-1">◀ Dia anterior</button><button class="btn sm" type="button" data-rdia="1">Próximo dia ▶</button></div>
   <div class="two" style="margin-top:12px"><div>${recCard(r,"Recomendado para "+dt(dia))}</div>
   <div><div class="card scroll"><table class="tbl"><tr><th>Trato</th><th>Hora</th><th class="r">Sugerido</th><th>Ofertado (g)</th><th>Bandeja</th><th>Muda</th></tr>${linhas}
     <tr class="tot"><td colspan="2">Total</td><td class="r">${n0(r.final)} g</td><td class="r">${n0(dado)} g</td><td colspan="2"></td></tr></table>
     <div class="row" style="margin-top:10px"><button class="btn p" type="button" id="salvarTratos">✓ Salvar tratos do dia</button><button class="btn sm" type="button" id="maisTrato">+ trato extra</button></div>
     <p class="muted">Confira a bandeja 1 a 2 horas depois de cada trato. O que você marcar aqui ajusta o próximo trato na hora e a ração de amanhã.</p></div></div></div>`};

T.manejo_parametros=()=>`<h2>Digitação de Parâmetros</h2>`+grade("parametros",[{t:"Data",v:r=>dt(r.data)}].concat(PARAMS.map(p=>({t:p.n.split(" (")[0],r:1,v:r=>r.valores&&r.valores[p.k]!=null?f(r.valores[p.k],p.d):"",h:r=>{const v=r.valores&&r.valores[p.k];if(v==null)return"";const nv=nivel(p.k,v);return nv==="crit"?`<span class="tag bad">${f(v,p.d)}</span>`:nv==="aten"?`<span class="tag w">${f(v,p.d)}</span>`:f(v,p.d)}}))).concat([{t:"Obs.",v:r=>r.obs||""}]),tipo("leitura"),{incluir:"parametros",vazio:"Nenhuma leitura ainda. Toque em Incluir."});
T.manejo_biometria=()=>{const bs=tipo("biometria");const cs=crescimentoSemanal(hoje());
  return `<h2>Biometria Semanal</h2><div class="grid">${kpi("Crescimento",f(cs.g,2)+" g/sem",cs.fonte)}${kpi("Peso estimado hoje",f(pesoEstimado(hoje()).p,2)+" g","")}${kpi("Meta de despesca",f(cfg.pesoAlvo,0)+" g","Cadastro")}</div>`+
  grade("biometria",[{t:"Data",v:r=>dt(r.data)},{t:"Pesados",r:1,v:r=>r.n||""},{t:"Peso total (g)",r:1,v:r=>r.pesoTotal?f(r.pesoTotal,1):""},{t:"Peso médio (g)",r:1,v:r=>f(r.peso,r.peso<1?3:2)},{t:"Sobrev. (%)",r:1,v:r=>r.sobrev!=null?f(r.sobrev,0):""},{t:"Obs.",v:r=>r.obs||""}],bs,{incluir:"biometria",vazio:"Nenhuma biometria ainda."})};
T.manejo_mortalidade=()=>`<h2>Registro de Mortalidade</h2>`+grade("mortalidade",[{t:"Data",v:r=>dt(r.data)},{t:"Mortos",r:1,v:r=>n0(r.qtd)},{t:"Obs.",v:r=>r.obs||""}],tipo("mortalidade"),{incluir:"mortalidade",vazio:"Nenhum registro de mortalidade."});
T.manejo_aplicacoes=()=>`<h2>Aplicações e insumos</h2><p class="muted">Prebiótico, probiótico, Nutrat, Bactrat, melaço, Azomite, minerais e calcário.</p>`+grade("aplicacoes",[{t:"Data",v:r=>dt(r.data)},{t:"Produto",v:r=>r.produto},{t:"Qtd.",r:1,v:r=>f(r.qtd,1)+" "+(r.un||"")},{t:"Obs.",v:r=>r.obs||""}],tipo("aplicacao"),{incluir:"aplicacao",vazio:"Nenhuma aplicação ainda."});

T.manejo_lua=()=>{const d0=new Date();const px=proximas(d0);let cal="";
  for(let i=0;i<28;i++){const d=new Date(+d0+i*864e5);const fs=fase(d);const jm=janelaMuda(d);cal+=`<div class="${jm.on?"hot":""} ${i===0?"today":""}"><div>${pad(d.getDate())}/${pad(d.getMonth()+1)}</div><div style="font-size:18px">${fs.i}</div></div>`}
  const jm=janelaMuda(d0);const kg=recomendacao(hoje()).final/1000;const az=cfg.doses.azomite;const alc=leituraRecente("alc",hoje());
  return `<h2>Calendário Lunar e muda</h2>
   <div class="banner ${jm.on?"w":"ok"}"><b>${jm.on?"Hoje está na janela de muda ("+jm.qual+")":"Fora da janela de muda hoje"}</b><small>Próxima lua cheia: ${dt(isoDia(px.cheia))} · próxima lua nova: ${dt(isoDia(px.nova))}. A janela vai de 2 dias antes a 2 dias depois de cada uma. O cálculo é feito no aparelho, sem internet.</small></div>
   <h3>Próximos 28 dias</h3><div class="moonrow">${cal}</div><p class="muted">Em destaque: dias da janela de muda.</p>
   <h3>O que fazer na janela</h3><div class="card"><ol style="margin:0;padding-left:20px">
    <li><b>Mais oxigênio:</b> abrir todos os difusores ou ligar o soprador reserva, meta de <b>OD ≥ 5,5 mg/L</b>, principalmente da meia-noite ao amanhecer. <span class="ev est">estudo</span> para a queda do OD à noite; <span class="ev camp">campo</span> para ligar o reserva na lua.</li>
    <li><b>Ração −20%</b>: o app já aplica esse corte nos dias da janela. <span class="ev camp">estimativa do manual</span></li>
    <li><b>Conferir alcalinidade ≥ 150</b> (última: ${alc?f(alc.v,0)+" mg/L em "+dt(alc.data):"sem leitura"}), <b>cálcio e magnésio</b>, e repor bicarbonato se precisar. Na muda a casca nova endurece com o cálcio, o magnésio e a alcalinidade da água. <span class="ev est">estudo</span></li>
    <li><b>Azomite na ração a ${f(az,1)} g/kg</b>: hoje ${f(az*kg,1)} g para ${f(kg,2)} kg de ração. <span class="ev est">estudo</span> Tan 2014: 2–4 g/kg melhorou crescimento e imunidade; 6–8 g/kg não teve efeito.</li></ol></div>
   <div class="banner w" style="margin-top:10px"><b>Subir o Azomite na muda é ideia do Wagner, sem estudo que comprove.</b><small>Se for testar, não passe de 4 g por kg de ração, que é o teto do estudo. Azomite jogado na água não tem estudo em camarão.</small></div>
   <p class="muted">Sobre a lua: a muda sincronizada com a lua está descrita em peneídeos, mas a força do efeito em tanque fechado é discutida. Por isso o app trata a lua como alerta preventivo e confirma pela bandeja e pela muda vista.</p>`};
T.manejo_projecao=()=>{const L=lote(hoje());const cs=crescimentoSemanal(hoje());const falta=cfg.pesoAlvo-L.peso;const sem=cs.g>0?falta/cs.g:null;
  let linhas="";let p=L.peso,d=hoje();for(let w=0;w<=12&&p<=cfg.pesoAlvo+cs.g;w++){const bio=L.vivos*p/1000;linhas+=`<tr><td>${dt(d)}</td><td class="r">${f(p,2)}</td><td class="r">${f(bio,1)}</td><td class="r">${f(pctTabela(p),1)}</td><td class="r">${n0(bio*1000*pctTabela(p)/100)}</td></tr>`;p+=cs.g;d=addDias(d,7)}
  return `<h2>Projeção para despesca</h2><div class="grid">${kpi("Peso atual (est.)",f(L.peso,2)+" g","")}${kpi("Meta",f(cfg.pesoAlvo,0)+" g","")}${kpi("Crescimento",f(cs.g,2)+" g/sem",cs.fonte)}${kpi("Despesca em",sem!=null&&falta>0?f(sem,1)+" sem":"meta atingida",sem!=null&&falta>0?"por volta de "+dt(addDias(hoje(),Math.round(sem*7))):"")}${kpi("Biomassa na despesca",f(L.vivos*cfg.pesoAlvo/1000,1)+" kg",n0(L.vivos)+" vivos hoje")}${(()=>{const fc=fcrCiclo();return kpi("Conversão do ciclo",fc?f(fc.fcr,2):"–",fc?f(fc.racaoKg,1)+" kg de ração ÷ "+f(fc.ganho,1)+" kg ganhos · biofloco 1,12–1,29 (Xu 2025)":"precisa de biometria e tratos lançados",fc&&fc.fcr>1.8?"w":"")})()}</div>
   <div class="card scroll" style="margin-top:12px"><table class="tbl"><tr><th>Semana</th><th class="r">Peso (g)</th><th class="r">Biomassa (kg)</th><th class="r">% peso</th><th class="r">Ração/dia (g)</th></tr>${linhas}</table></div><p class="muted">Projeção sem mortalidade adicional. Fica mais precisa a cada biometria.</p><div class="banner w"><b>No dia da despesca: guardar as mantas úmidas</b><small>Assim as bactérias nitrificantes sobrevivem e o próximo ciclo estabiliza o nitrito mais rápido. Devolver a água ao tanque, que fica madura.</small></div>`};

function chartSvg(pts,band,unit,dec){
  if(!pts.length)return `<div class="empty">Sem dados ainda.</div>`;
  const W=360,H=200,L=40,R=12,Tp=14,B=26;const ys=pts.map(p=>p.y),xs=pts.map(p=>p.x);
  let y0=Math.min(...ys),y1=Math.max(...ys);if(band){[band.min,band.max].forEach(v=>{if(v!=null){y0=Math.min(y0,v);y1=Math.max(y1,v)}})}
  if(y0===y1){y0-=1;y1+=1}const py=(y1-y0)*.1;y0-=py;y1+=py;let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=864e5;x1+=864e5}
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R),sy=y=>Tp+(1-(y-y0)/(y1-y0))*(H-Tp-B);let g="";
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=sy(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-5}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted)">${f(v,dec)}</text>`}
  if(band&&(band.min!=null||band.max!=null)){const a=band.max!=null?sy(band.max):Tp,b=band.min!=null?sy(band.min):H-B;g+=`<rect x="${L}" y="${Math.min(a,b)}" width="${W-L-R}" height="${Math.abs(b-a)}" fill="var(--good)" opacity=".13"/>`}
  const nt=Math.min(4,pts.length);for(let i=0;i<nt;i++){const x=x0+(x1-x0)*(nt===1?.5:i/(nt-1)),dd=new Date(x);g+=`<text x="${sx(x)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)">${pad(dd.getDate())}/${pad(dd.getMonth()+1)}</text>`}
  g+=`<path d="${pts.map((p,i)=>(i?"L":"M")+sx(p.x).toFixed(1)+" "+sy(p.y).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  g+=pts.map((p,i)=>{const out=band&&((band.min!=null&&p.y<band.min)||(band.max!=null&&p.y>band.max));return `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${i===pts.length-1?4.5:3}" fill="${out?"var(--bad)":"var(--accent)"}" stroke="var(--card)" stroke-width="1.5"/>`}).join("");
  const lp=pts[pts.length-1];g+=`<text x="${Math.min(sx(lp.x),W-R-2)}" y="${Math.max(sy(lp.y)-8,10)}" text-anchor="end" font-size="10" font-weight="700" fill="var(--ink)">${f(lp.y,dec)} ${esc(unit)}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico">${g}</svg></div>`}
/* ===================== plano do ciclo: Iniciar, Reset, esperado × real ===================== */
const PREPARO_DIAS=21;
function diasAte(peso){for(let d=0;d<=400;d++)if(curva(d)>=peso)return d;return 400}
function planoCalc(o){const t=tanque();const dens=num(o.densidade)||cfg.densidade,S=num(o.sobrevivencia)??cfg.sobrevivencia,W=num(o.pesoAlvo)||cfg.pesoAlvo,fca=num(o.fcr)||cfg.fcr,pv=num(o.preco)||precoVendaRef(W);
  const pls=Math.round(t.area*dens),dias=diasAte(W),kg=pls*S/100*W/1000,receita=kg*pv;let rac=0;for(let d=0;d<dias;d++){const p=curva(d);rac+=pls*(100-(100-S)*Math.min(1,d/dias))/100*p*pctTabela(p)/100}rac/=1000; // ração somada pela tabela do manual, a mesma conta da curva esperada
  const prRac=precoRef(produtos().find(p=>p.grupo==="RACAO"))||PRECO_REF["Ração 40% PB"];const cRac=rac*prRac,cPl=pls/1000*PL_MILHEIRO_REF,cEn=(cfg.eco.kw||0)*24*(dias+PREPARO_DIAS)*(cfg.eco.tarifa||0);
  const pov=o.dia1?addDias(o.dia1,PREPARO_DIAS):"";return{pls,dias,kg,rac,receita,cRac,cPl,cEn,lucro:receita-cRac-cPl-cEn,pov,desp:pov?addDias(pov,dias):"",dens,S,W,fca,pv}}
function espSobrev(dc){const D=(cfg.plano&&cfg.plano.dias)||diasAte(cfg.pesoAlvo);return 100-(100-cfg.sobrevivencia)*Math.min(1,Math.max(0,dc)/D)}
function espRacaoDia(dc){const p=curva(Math.max(0,dc));return tanque().pls*espSobrev(dc)/100*p*pctTabela(p)/100}
function espRacaoAte(dc){let s=0;for(let d=0;d<=dc;d++)s+=espRacaoDia(d);return s}
function desvio(real,esp){if(real==null||!esp)return null;const d=(real-esp)/esp*100;return{d,n:Math.abs(d)<15?"ok":Math.abs(d)<30?"aten":"crit",t:Math.abs(d)<15?"ok":Math.abs(d)<30?"atenção":"fora"}}
function realSeries(){const dp=cfg.dataPovoamento;if(!dp)return{peso:[],sob:[],rac:[]};const asc=recs.slice().reverse();
  const peso=asc.filter(r=>r.tipo==="biometria").map(r=>({x:diasEntre(dp,r.data),y:r.peso})).filter(p=>p.x>=0);
  const sob=asc.filter(r=>r.tipo==="biometria"&&r.sobrev!=null).map(r=>({x:diasEntre(dp,r.data),y:r.sobrev})).filter(p=>p.x>=0);
  const m={};asc.filter(r=>r.tipo==="racao").forEach(r=>{const d=diasEntre(dp,r.dia||r.data);if(d>=0)m[d]=(m[d]||0)+(r.qtd||0)});let ac=0;const rac=Object.keys(m).map(Number).sort((a,b)=>a-b).map(d=>{ac+=m[d];return{x:d,y:ac/1000}});return{peso,sob,rac}}
function espSerie(k,ate){const out=[];const D=Math.max(ate,7);let ac=0;for(let d=0;d<=D;d++){if(k==="rac")ac+=espRacaoDia(d);if(d%3&&d!==D)continue;out.push({x:d,y:k==="peso"?curva(d):k==="sob"?espSobrev(d):ac/1000})}return out}
function chartDuo(esp,real,unit,dec){
  if(!esp.length)return `<div class="empty">Sem plano ainda.</div>`;
  const W=360,H=210,L=40,R=12,Tp=14,B=30;const all=esp.concat(real);let y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));if(y0===y1){y0-=1;y1+=1}const py=(y1-y0)*.08;y0=Math.max(0,y0-py);y1+=py;
  const x0=0,x1=Math.max(...all.map(p=>p.x),1);const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R),sy=y=>Tp+(1-(y-y0)/(y1-y0))*(H-Tp-B);let g="";
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=sy(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-5}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted)">${f(v,dec)}</text>`}
  for(let i=0;i<=4;i++){const x=Math.round(x1*i/4);g+=`<text x="${sx(x)}" y="${H-14}" text-anchor="middle" font-size="9" fill="var(--muted)">dia ${x}</text>`}
  g+=`<path d="${esp.map((p,i)=>(i?"L":"M")+sx(p.x).toFixed(1)+" "+sy(p.y).toFixed(1)).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>`;
  if(real.length){g+=`<path d="${real.map((p,i)=>(i?"L":"M")+sx(p.x).toFixed(1)+" "+sy(p.y).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
    g+=real.map(p=>{const e=esp.reduce((a,b)=>Math.abs(b.x-p.x)<Math.abs(a.x-p.x)?b:a);const dv=desvio(p.y,e.y);return `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="3.5" fill="${dv&&dv.n==="crit"?"var(--bad)":dv&&dv.n==="aten"?"var(--warn)":"var(--accent)"}" stroke="var(--card)" stroke-width="1.5"/>`}).join("")}
  g+=`<line x1="${L}" x2="${L+18}" y1="${H-3}" y2="${H-3}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><text x="${L+22}" y="${H}" font-size="9" fill="var(--muted)">esperado</text><line x1="${L+80}" x2="${L+98}" y1="${H-3}" y2="${H-3}" stroke="var(--accent)" stroke-width="2.5"/><text x="${L+102}" y="${H}" font-size="9" fill="var(--muted)">seu (${esc(unit)})</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Esperado e real">${g}</svg></div>`}
function cartaoPlano(){
  const bt=`<div class="row" style="margin-top:6px"><button class="btn p sm" type="button" data-acao="iniciar">▶ Iniciar ciclo</button><button class="btn sm del" type="button" data-acao="reset">${pendDel==="_reset"?"Confirmar: apagar tudo deste perfil":"↺ Reset"}</button></div>`;
  if(!cfg.plano)return `<div class="card" style="margin-bottom:12px"><b>Plano do ciclo</b><div class="muted">Toque em Iniciar para escolher o dia do preparo, a densidade e o peso de despesca. O app monta o calendário até a despesca e compara o que você lança com o esperado.</div>${bt}</div>`;
  const p=cfg.plano,dc=diaCultivo();let h=`<div class="card" style="margin-bottom:12px"><b>Plano do ciclo</b><div class="muted">Preparo ${dt(p.dia1)} · povoamento ${dt(cfg.dataPovoamento)} · despesca ${dt(p.despesca)} (${p.dias} dias de cultivo) · ${f(p.kg,0)} kg esperados</div>`;
  if(dc!=null&&dc>=0){const rs=realSeries();const ub=rs.peso[rs.peso.length-1],us=rs.sob[rs.sob.length-1],ur=rs.rac[rs.rac.length-1];
    const lin=(nome,esp,real,un,dec,dia)=>{const dv=real!=null?desvio(real,esp):null;return `<tr><td>${nome}</td><td class="r">${f(esp,dec)} ${un}</td><td class="r">${real!=null?f(real,dec)+" "+un+(dia!=null?` <small class="muted">dia ${dia}</small>`:""):"—"}</td><td>${dv?`<span class="tag ${{ok:"ok",aten:"w",crit:"bad"}[dv.n]}">${dv.d>0?"+":""}${f(dv.d,0)}% ${dv.t}</span>`:""}</td></tr>`};
    h+=`<div class="scroll"><table class="tbl"><tr><th>Dia ${dc}</th><th class="r">Esperado</th><th class="r">Seu</th><th></th></tr>`+
      lin("Peso médio",ub?curva(ub.x):curva(dc),ub?ub.y:null,"g",2,ub&&ub.x)+lin("Sobrevivência",us?espSobrev(us.x):espSobrev(dc),us?us.y:null,"%",0,us&&us.x)+
      lin("Ração do dia",espRacaoDia(dc)/1000,tratosDoDia(hoje()).length?tratosDoDia(hoje()).reduce((s,x)=>s+(x.qtd||0),0)/1000:null,"kg",2)+lin("Ração acumulada",ur?espRacaoAte(ur.x)/1000:espRacaoAte(dc)/1000,ur?ur.y:null,"kg",1,ur&&ur.x)+`</table></div><div class="muted">Até 15% de diferença é normal (Zeigler 2015); 15 a 30% pede atenção; acima de 30% está muito fora (regra do app). <a href="#" data-go="relatorios.graficos">Ver as duas curvas</a></div>`}
  else if(dc!=null)h+=`<div class="muted">Faltam ${-dc} dia(s) para povoar. Siga o Preparo da água.</div>`;
  return h+bt+`</div>`}
ACOES.iniciar=function(){const hj=hoje();
  form("Iniciar ciclo",[{name:"dia1",label:"Dia 1: começo do preparo da água virgem",type:"date",value:hj,req:true},
    {html:`<div class="fg">`},{name:"densidade",label:"Densidade (camarões/m²)",type:"number",value:cfg.densidade},{name:"pesoInicial",label:"Peso da PL (g)",type:"number",value:cfg.pesoInicial},{name:"pesoAlvo",label:"Peso de despesca (g)",type:"number",value:cfg.pesoAlvo},{name:"sobrevivencia",label:"Sobrevivência esperada (%)",type:"number",value:cfg.sobrevivencia},{name:"fcr",label:"Conversão alimentar (FCA)",type:"number",value:cfg.fcr},{name:"preco",label:"Preço de venda (R$/kg)",type:"number",value:precoVendaRef(cfg.pesoAlvo)},{html:`</div>`},
    {html:`<div class="muted" style="margin:4px 0 8px">Valores sugeridos são os do manual e do memorial: ${PREPARO_DIAS} dias de preparo, 500/m², PL de 0,02 g, despesca com 15 g (cerca de ${diasAte(15)} dias pela curva), 85% de sobrevivência e FCA 1,5 (estudos de biofloco em densidade parecida deram de 1,2 a 1,8: Purdue FNR-495-W; Samocha 2012; Hanson 2013). A ração esperada é somada pela tabela do manual, dia a dia. Tanque do Cadastro: ${f(cfg.diametro,1)} m × ${f(cfg.profundidade,1)} m.</div>`}],
    o=>{if(!o.dia1)return["Escolha o dia 1"];const c=planoCalc(o);return[`Preparo: ${dt(o.dia1)} a ${dt(addDias(o.dia1,PREPARO_DIAS-1))} (${PREPARO_DIAS} dias)`,`Povoamento: ${dt(c.pov)} com ${n0(c.pls)} PLs`,`Despesca: ${dt(c.desp)} (${c.dias} dias de cultivo, ${f(c.W,0)} g)`,`Esperado: ${f(c.kg,0)} kg de camarão e ${f(c.rac,0)} kg de ração pela tabela (conversão ${f(c.rac/c.kg,2)})`,`Receita R$ ${n0(c.receita)} − ração R$ ${n0(c.cRac)} − PL R$ ${n0(c.cPl)} − energia R$ ${n0(c.cEn)} = lucro estimado R$ ${n0(c.lucro)} (sem outros insumos e mão de obra)`,"Lembre também: salinidade da água, preço real da PL e da ração (Estoque › Entradas) e o tamanho do tanque em Ajustes › Tanque.","Ao salvar, os lançamentos anteriores saem da tela (ficam guardados) e o app passa a comparar cada dia com este plano."]},
    async o=>{if(!o.dia1)return toast("Escolha o dia 1.");if(cfg.exemplo)await apagarExemplo();const c=planoCalc(o);const n=clone(cfg);Object.assign(n,{densidade:c.dens,pesoAlvo:c.W,sobrevivencia:c.S,fcr:c.fca,dataPovoamento:c.pov,exemplo:false,exemploVisto:true,cicloId:"c"+Date.now().toString(36),cicloInicio:o.dia1<hj?o.dia1:agora()});
      if(num(o.pesoInicial))n.pesoInicial=num(o.pesoInicial);n.eco=Object.assign({},n.eco,{preco:c.pv});n.plano={dia1:o.dia1,dias:c.dias,despesca:c.desp,kg:Math.round(c.kg*10)/10,criado:agora()};
      prep.feitos={};await savePrep();await saveCfg(n);go("hoje","inicio_painel");toast("Ciclo iniciado",["Povoamento "+dt(c.pov),"Despesca "+dt(c.desp)])})};

T.relatorios_graficos=()=>{
  const ops=PARAMS.map(p=>[p.k,p.n]).concat([["_cPeso","Esperado × real: peso médio"],["_cRac","Esperado × real: ração acumulada"],["_cSob","Esperado × real: sobrevivência"],["_peso","Peso médio (biometria)"],["_rac","Ração ofertada por dia"],["_mort","Mortalidade por dia"]]);
  const asc=recs.slice().reverse();let pts=[],band=null,unit="",dec=1;
  if(/^_c/.test(chartSel)){const k={_cPeso:"peso",_cRac:"rac",_cSob:"sob"}[chartSel];const rs=realSeries()[k];const dc=diaCultivo();const ate=Math.max((cfg.plano&&cfg.plano.dias)||diasAte(cfg.pesoAlvo),dc||0,...rs.map(p=>p.x));const u={peso:"g",rac:"kg",sob:"%"}[k];
    return `<h2>Gráficos</h2><div class="card"><div class="f"><label for="gSel">Mostrar</label><select id="gSel">${opt(ops,chartSel)}</select></div>${cfg.dataPovoamento?chartDuo(espSerie(k,ate),rs,u,k==="peso"?1:0):`<div class="empty">Sem data de povoamento. Use Iniciar ciclo no Mapa do tanque.</div>`}<p class="muted">Linha tracejada = esperado pelo plano (curva do manual). Linha cheia = seus lançamentos. Ponto laranja: 15 a 30% fora; vermelho: mais de 30%.</p></div>`}
  if(chartSel==="_peso"){pts=asc.filter(r=>r.tipo==="biometria").map(r=>({x:+toDate(r.data),y:r.peso}));unit="g";dec=2}
  else if(chartSel==="_rac"||chartSel==="_mort"){const t=chartSel==="_rac"?"racao":"mortalidade";const m={};asc.filter(r=>r.tipo===t).forEach(r=>{const d=r.data.slice(0,10);m[d]=(m[d]||0)+(r.qtd||0)});pts=Object.keys(m).sort().map(d=>({x:+toDate(d),y:m[d]}));unit=t==="racao"?"g":"";dec=0}
  else{const p=PARAMS.find(x=>x.k===chartSel);pts=asc.filter(r=>r.tipo==="leitura"&&r.valores&&r.valores[chartSel]!=null).map(r=>({x:+toDate(r.data),y:r.valores[chartSel]}));band=cfg.faixas[chartSel];unit=p.u.split(" ")[0];dec=p.d}
  return `<h2>Gráficos</h2><div class="card"><div class="f"><label for="gSel">Mostrar</label><select id="gSel">${opt(ops,chartSel)}</select></div>${chartSvg(pts,band,unit,dec)}${band?`<p class="muted">Faixa verde = aceito (${faixaTxt(chartSel)}). Pontos vermelhos saíram da faixa.</p>`:""}</div>`};
function resumo(r){if(r.tipo==="leitura")return PARAMS.filter(p=>r.valores&&r.valores[p.k]!=null).map(p=>p.n.split(" (")[0]+" "+f(r.valores[p.k],p.d)).join(" · ");
  if(r.tipo==="biometria")return"Peso médio "+f(r.peso,r.peso<1?3:2)+" g";if(r.tipo==="mortalidade")return n0(r.qtd)+" mortos";
  if(r.tipo==="aplicacao")return r.produto+" "+f(r.qtd,1)+" "+(r.un||"");if(r.tipo==="ritual")return Object.values(r.itens||{}).filter(Boolean).length+" itens feitos"+(r.espuma?" · espuma "+r.espuma:"");if(r.tipo==="racao")return r.trato+"º trato "+n0(r.qtd)+" g"+(r.bandeja?" · bandeja "+r.bandeja:"")+(r.muda?" · muda":"");return""}

T.aprenda_quando=()=>`<div class="learn"><h2>Quando aumentar ou reduzir a ração</h2>
 <p>A ração do dia nasce de uma conta e é corrigida pelo que o camarão mostra. A conta dá o ponto de partida; a bandeja e a água dizem se ele aceitou.</p>
 <h3>1. A conta</h3><p><b>Ração do dia = vivos × peso médio (g) × % da tabela ÷ 100.</b> A % cai conforme ele cresce: 15% até 0,2 g, 12% até 0,5 g, 10% até 1 g, 6% até 3 g, 5% até 5 g, 4% até 10 g, 3,5% até 15 g e 3% depois. Por isso a <b>biometria semanal</b> é o que mais move a ração: ela troca a faixa da tabela.</p>
 <p>O app confere com a conta da Purdue: vivos × ganho semanal × conversão ÷ 7. Se as duas ficarem muito longe, desconfie da biometria ou da contagem.</p>
 <h3>2. SUBIR 5–10%: só com tudo isto junto</h3><ul>
  <li>Bandeja <b>vazia</b> 1–2 h depois do trato;</li><li><b>OD ≥ 5</b> mg/L;</li><li><b>Amônia &lt; 1</b> e <b>nitrito &lt; 1</b> mg/L;</li><li><b>Não</b> ser dia de muda (lua cheia ou nova, ou muda vista).</li></ul>
 <p>Por quê: bandeja vazia mostra fome, mas se a água já está no limite, mais ração vira mais amônia e menos oxigênio. Subir aos poucos evita passar do ponto.</p>
 <h3>3. MANTER</h3><p>Quando sobrou <b>pouco</b> na bandeja. É o ponto certo: comeu quase tudo e não há desperdício.</p>
 <h3>4. BAIXAR 10–30%</h3><ul>
  <li><b>Sobrou muito</b> na bandeja: −10% (um trato) a −20% (dois ou mais). Sobra apodrece, gasta oxigênio e vira amônia.</li>
  <li><b>OD &lt; 4</b>: −20%. Abaixo de 3, suspenda e ligue toda a aeração. Digerir gasta oxigênio.</li>
  <li><b>Amônia &gt; 1</b>: −30% e açúcar (amônia × m³ × 20 g). A amônia vem da proteína da ração.</li>
  <li><b>Nitrito &gt; 1</b>: −15%. As bactérias não estão dando conta.</li>
  <li><b>Cone Imhoff &gt; 20 mL/L</b>: −15% e Nutrat dobrado. Sem dreno, a carga só cai se entrar menos.</li>
  <li><b>Dia de muda</b> (lua cheia ou nova): cerca de −40% por 3 a 4 dias (Molina 2000: consumo cai 35 a 50%), com mais ar. As telas de poliéster no tanque dão abrigo ao camarão mole (Zhang 2010).</li></ul>
 <p class="muted">Dos cortes acima, só o da amônia tem número publicado (Alune 2020: 30 a 40%) e o da temperatura tem estudo de apetite (Zhang 2025). Os tamanhos dos outros cortes (oxigênio, nitrito, cone, lua) são regra do app e do manual, sem estudo que dê o número: a bandeja do dia seguinte é quem confirma.</p>
 <p class="muted">Com bandeja vazia e água boa, se a ração estiver abaixo da tabela o app volta para a tabela.</p>
 <p class="muted">O app aplica essas regras sozinho na Digitação de Ração e escreve o motivo de cada ajuste. A ração de amanhã sai dos tratos e das bandejas de hoje.</p></div>`;
T.aprenda_regras=()=>`<div class="learn"><h2>Regras do app e o que é estudo ou prática</h2>
 <div class="card scroll"><table class="tbl"><tr><th>Regra</th><th>Efeito</th><th>Base</th></tr>
 <tr><td>Ração = vivos × peso × % por faixa de peso</td><td>Ponto de partida</td><td><span class="ev est">estudo</span> Purdue, CIBA</td></tr>
 <tr><td>Conferência pelo crescimento × FCR</td><td>Checagem</td><td><span class="ev est">estudo</span> Purdue</td></tr>
 <tr><td>Bandeja vazia + água boa / pouca / muita</td><td>+7% / 0 / −10 a −20%</td><td><span class="ev est">estudo</span> FAO, Purdue</td></tr>
 <tr><td>OD &lt; 4 e &lt; 3 mg/L</td><td>−20% / suspender</td><td><span class="ev camp">regra do app</span>: cortar ração com oxigênio baixo tem apoio (Davis e Venero 2005), o número não tem estudo</td></tr>
 <tr><td>Amônia &gt; 1</td><td>−30%</td><td><span class="ev est">estudo</span> Alune 2020 (30 a 40%)</td></tr>
 <tr><td>Nitrito &gt; 1</td><td>−15%</td><td><span class="ev camp">regra do app</span>, sem estudo que dê o número</td></tr>
 <tr><td>Mortos acima de 0,5% ao dia</td><td>−20%</td><td><span class="ev camp">regra do app</span>, sem estudo que dê o número</td></tr>
 <tr><td>Emergências (cheiro de ovo, fezes brancas, mancha branca, Vibrio, pH alto)</td><td>−30%, −50% ou metade</td><td><span class="ev camp">regra do app</span>, sem estudo que dê o número</td></tr>
 <tr><td>Bandeja vazia, água boa e ração abaixo da tabela</td><td>Volta para a tabela</td><td>Manual (tabela do cap. 8); achado do simulador</td></tr>
 <tr><td>Plano: esperado × real</td><td>Até 15% normal; 15 a 30% atenção; acima de 30% fora</td><td>15%: <span class="ev est">estudo</span> Zeigler, Browdy e Stock 2015 (diferenças acima de 10 a 15% entre médias já são relevantes). 30%: <span class="ev camp">regra do app</span>, sem estudo</td></tr>
 <tr><td>Plano: vivos esperados</td><td>Linha de 100% até 85% na despesca</td><td>Manual, tabela 8.3</td></tr>
 <tr><td>Plano: conversão 1,5 e ração pela tabela</td><td>Prévia do Iniciar</td><td><span class="ev est">estudo</span> Purdue FNR-495-W (1,2 a 1,8); Samocha 2012 (1,43 a 1,77); Hanson 2013 (1,25 a 1,48)</td></tr>
 <tr><td>Espuma crespa, cone &gt; 20, amônia &gt; 1, nitrito &gt; 1, OD &lt; 4 (depois do ar), lua</td><td>Nutrat em dobro, mesma dose em qualquer salinidade</td><td><span class="ev camp">Só Bioflocos</span>; efeito no O₂ é promessa do fabricante</td></tr>
 <tr><td>Cone &gt; 20 mL/L</td><td>−15%, Nutrat em dobro</td><td><span class="ev camp">Só Bioflocos</span>; o −15% é regra do app, sem estudo que dê o número</td></tr>
 <tr><td>Bicarbonato 0,25 kg/kg de ração</td><td>Reposição diária</td><td><span class="ev est">estudo</span></td></tr>
 <tr><td>Açúcar 20 g por g de amônia-N</td><td>Quando amônia &gt; 1</td><td><span class="ev est">estudo</span> Avnimelech</td></tr>
 <tr><td>Ritual: espuma, cone, Nutrat, simbiótico, Azomite, difusores</td><td>Checklist diário</td><td><span class="ev camp">Só Bioflocos</span></td></tr>
 <tr><td>Azomite 3 g/kg de ração</td><td>Todo dia</td><td><span class="ev est">estudo</span> Tan 2014</td></tr>
 <tr><td>Janela de lua cheia/nova</td><td>−40% (Molina 2000), ar, alcalinidade, Ca/Mg</td><td><span class="ev camp">campo</span> (manual). Nenhum estudo mede o efeito da lua na ração ou na morte do vannamei; Almeida Neto e Freire 2007 não acharam ligação entre sobra e fase da muda</td></tr>
 <tr><td>Decantador: liga com cone &gt; 15, desliga em 10, alerta com 3 dias ligado, lodo do registro todo dia</td><td>Substitui o dreno</td><td><span class="ev est">estudo</span> Nunes e Castro 2012</td></tr>
 <tr><td>Skimmer: conferir antes de dobrar o Nutrat</td><td>Menos espuma marrom, OD melhor</td><td><span class="ev est">estudo</span> Samocha (raceway)</td></tr>
 <tr><td>Alarme de OD em 4,5 e teste do gerador às segundas</td><td>Plano B de oxigênio</td><td><span class="ev est">estudo</span></td></tr>
 <tr><td>Farelo fermentado como carbono; açúcar só com amônia &gt; 1; sem melaço</td><td>Carbono do dia</td><td><span class="ev est">estudo</span> FURG; Ray e Lotz 2014</td></tr>
 <tr><td>Mantas de biofilme; dias até o nitrito estabilizar</td><td>Comparar ciclos</td><td><span class="ev est">promissor</span> FURG 2022</td></tr>
 <tr><td>Temperatura entre 22 e 26 °C</td><td>Ração −10%</td><td><span class="ev est">estudo</span> Zhang 2025 (laboratório)</td></tr>
 <tr><td>Conversão alimentar do ciclo &gt; 1,8 (a partir do dia 21, com biometria)</td><td>Alerta: conferir biometria e sobra</td><td><span class="ev est">estudo</span> Xu 2025 (1,12–1,29 em biofloco)</td></tr>
 <tr><td>Relação C:N do dia</td><td>Só mostra a conta; referência 10 : 1</td><td><span class="ev est">estudo</span> Halim 2025; estimativa de carbono do app</td></tr>
 <tr><td>Densidade 400–600 por m³</td><td>Aviso no Cadastro do tanque</td><td><span class="ev est">estudo</span> Xu 2025</td></tr>
 <tr><td>Mais Azomite na muda</td><td>Não aplicado pelo app</td><td>Ideia do Wagner, sem estudo. Teto 4 g/kg.</td></tr></table></div>
 <h3>Referências</h3><ul class="ref">
  <li>Caderno Só Bioflocos (NotebookLM, 28 vídeos do canal @SoBioflocos), consultas de 18/11/2026.</li>
  <li>Rode, R. Marine Shrimp Biofloc Systems: Basic Management Practices. Purdue Extension FNR-495-W, 2014.</li>
  <li>Hargreaves, J. Biofloc Production Systems for Aquaculture. SRAC 4503, 2013.</li>
  <li>CIBA. Training manual on Biofloc Technology for Nursery and Growout, 2021.</li>
  <li>FAO. On-farm feeding and feed management in whiteleg shrimp.</li>
  <li>Avnimelech, Y. Biofloc Technology: A Practical Guide Book. World Aquaculture Society, 2015.</li>
  <li>Tan et al. Effects of supplemental Azomite in diets on growth and immune function of L. vannamei. Aquaculture Nutrition, 2014.</li>
  <li>Manual de cultivo de vannamei em bioflocos (Aqua Cultivo Novaes, v1, 18/11/2026), caps. 8 a 10.</li></ul></div>`;

T.aprenda_estudos=()=>{const E=[
 ["Densidade","Xu et al. 2025, Fishes 10(7):326","10.3390/fishes10070326","ok","Bioflocos de 200 a 800 camarões por m³: a amônia foi de 0,4 para 2,3 mg/L e o nitrito de 1,0 para 4,2 mg/L no pico; peso de despesca de 19,1 para 14,1 g; sobrevivência de 94,6% para 79,8%; produção de 3,6 para 9,1 kg/m³; conversão de 1,12 para 1,29. Faixa ótima 400–600 por m³.","Aviso no Cadastro do tanque. Nossos ~555 por m³ estão dentro."],
 ["Densidade","Said et al. 2024, Scientific Reports 14:11147","10.1038/s41598-024-61328-4","ok","Bioflocos, 50 contra 200 camarões por m², 16 semanas: densidade alta teve menor sobrevivência e crescimento, mais Vibrio na água (3,59 contra 2,45 log UFC/mL) e no camarão, e brânquia lesada.","Reforça não passar da densidade decidida e medir Vibrio se houver mortalidade."],
 ["Densidade","Khanjani 2026, Annals of Animal Science 26(2):813","10.2478/aoas-2025-0087","parcial","Bioflocos, 35 dias: no grupo mais denso, peso 7,01 g e sobrevivência 88,19%; o autor recomenda até 0,616 g de camarão por litro. Os números de conversão do carrossel não estão no resumo.","Só leitura."],
 ["Carbono (C:N)","Halim et al. 2025, Aquaculture, Fish and Fisheries 5:e70032","10.1002/aff2.70032","ok","Bioflocos com melaço, C:N 10 a 25 (vannamei junto com camarão de água doce): C:N 10 deu sobrevivência de 95,3%, conversão 1,58 e o melhor retorno econômico.","Referência 10 : 1 na conta de C:N do dia."],
 ["Carbono (C:N)","Cao et al. 2025, Bioresource Technology 435:132961","10.1016/j.biortech.2025.132961","nao","Carrossel: C:N 20 com glicose derrubou a amônia em 98%; C:N 15 deu +32% de peso.","Citado como não conferido."],
 ["Aeração","Han et al. 2025, Water 17(1):41","10.3390/w17010041","parcial","Bioflocos com 75, 35 e 10 L/min de ar: o DHA do floco foi maior com 75 L/min (resumo). O resto do carrossel veio do corpo do artigo.","Reforça ar no máximo e a academia de 1 h."],
 ["Oxigênio","Patkaew et al. 2024, Veterinary World 17:50","10.14202/vetworld.2024.50-58","ok","OD a 15 mg/L (O₂ puro) contra 5 mg/L por 30 dias: peso 14,73 contra 12,13 g e conversão 1,55 contra 2,51.","Reforça a meta OD ≥ 5 e o plano B com cilindro de O₂."],
 ["Probiótico","Vega-Carranza et al. 2024, Animals 14:2676","10.3390/ani14182676","ok","Sem troca de água: Bacillus licheniformis e bactérias lácticas baixaram a amônia e aumentaram peso e sobrevivência.","Reforça o probiótico na bombona."],
 ["Temperatura","Zhang et al. 2025, Animals 15:2113","10.3390/ani15142113","ok","Consumo de ração em 30 min: 0,46 g a 20 °C e 0,95 g a 32 °C; amônia 12 mg/L e nitrito 40 mg/L também cortaram o consumo.","Ração −10% entre 22 e 26 °C (abaixo de 22, −25% como antes)."],
 ["Tratos por dia","Liang et al. 2025, Animals 15:192","10.3390/ani15020192","ok","Alimentador automático: 6 a 8 tratos por dia foi o melhor (ótimo 7,8), melhor que o manual.","Ideia para quando houver alimentador. O app segue com os tratos da tabela."],
 ["Proteína","Araujo et al. 2025, Aquaculture Nutrition","10.1155/anu/4942439","ok","Mais proteína ingerida, mais crescimento; menos proteína, melhor aproveitamento. Sobrevivência 94–98% em todas.","Cadastre a % de proteína da ração (entra na conta de C:N)."],
 ["Despesca parcial","Da Silveira et al. 2022, Aquaculture 546:737408 (FURG)","10.1016/j.aquaculture.2021.737408","nao","Carrossel: despescas parciais subiram a sobrevivência de 43,7% para 82,7–86,6% e o peso de 16,1 para 20,1 g.","Citado no alerta de 6 kg/m³."],
 ["Alcalinidade","Amjad et al. 2025, Aquaculture Reports 42:102797","10.1016/j.aqrep.2025.102797","nao","Carrossel: no berçário, carbonato de cálcio deu mais peso e melhor conversão que magnésio.","Só leitura. O app segue com bicarbonato até 150–180."],
 ["Mg/Ca","Al-Subiai et al. 2025, Aquaculture 594:741405","10.1016/j.aquaculture.2024.741405","nao","Carrossel: água de poço de baixa salinidade, Mg/Ca perto de 2 subiu a sobrevivência do berçário de 58% para mais de 92%.","Só vale se o tanque usar água de baixa salinidade."],
 ["Berçário","Pereira dos Santos et al. 2024, Isotopes Environ Health Stud 60:528","10.1080/10256016.2024.2397472","nao","Carrossel: diatomácea Navicula a cada 10 dias no berçário de biofloco melhorou peso e conversão.","Ideia para berçário."],
 ["Sal baixo","Wang et al. 2025, Biology 14:1082","10.3390/biology14081082","ok","Pós-larva em sal baixo: sobrevivência 61% contra 93%; taurina na ração subiu para 77%.","Só se a aclimatação for para sal baixo."]];
 const tag=v=>v==="ok"?'<span class="ev est">conferido</span>':v==="parcial"?'<span class="ev camp">em parte</span>':'<span class="ev">não conferido</span>';
 return `<div class="learn"><h2>Estudos dos carrosséis do @aquacultivonovaes</h2><p>Estes são os artigos que a esteira do Papo de Carcinicultor usou e que tocam no manejo do tanque. "Conferido" quer dizer que os números batem com o resumo do artigo (PubMed ou site da revista, 21/11/2026). "Não conferido" quer dizer que o resumo não estava aberto; o número é o que a esteira leu.</p>
 <div class="card scroll"><table class="tbl"><tr><th>Assunto</th><th>O que o estudo achou</th><th>O que o app faz</th></tr>${E.map(e=>`<tr><td><b>${esc(e[0])}</b><div class="muted">${esc(e[1])}</div><div>${tag(e[3])} <a href="https://doi.org/${e[2]}" target="_blank" rel="noopener">DOI</a></div></td><td>${esc(e[4])}</td><td>${esc(e[5])}</td></tr>`).join("")}</table></div>
 <p class="muted">Lista completa dos 25 carrosséis, com slides e legendas: esteira-aquacultivo/carrosseis-e-referencias.md, na pasta do projeto.</p></div>`};
T.cadastro_tanque=()=>{const t=tanque();const c=cfg;const i=(id,l,v)=>`<div class="f"><label for="${id}">${l}</label><input id="${id}" type="number" inputmode="decimal" step="any" value="${v??""}"></div>`;
  return `<h2>Tanque e povoamento</h2><div class="card"><div class="f"><label for="c_nome">Nome do tanque</label><input id="c_nome" value="${esc(c.nome)}"></div>
   <div class="fg">${i("c_diam","Diâmetro (m)",c.diametro)}${i("c_prof","Lâmina d’água (m)",c.profundidade)}${i("c_dens","Densidade (camarões/m²)",c.densidade)}<div class="f"><label for="c_data">Data do povoamento (ou a planejada)</label><input id="c_data" type="date" value="${esc(c.dataPovoamento)}"></div>
   ${i("c_pi","Peso inicial da PL (g)",c.pesoInicial)}${i("c_sob","Sobrevivência estimada (%)",c.sobrevivencia)}${i("c_alvo","Peso de despesca (g)",c.pesoAlvo)}
   ${i("c_fcr","Conversão alimentar (FCR) p/ conferência",c.fcr)}${i("c_slab","Salinidade da água do laboratório (ppt)",c.salLab)}</div>
   ${(()=>{const d3=c.densidade/c.profundidade;const fora=d3<400||d3>600;return `<div class="banner ${fora?"w":""}" style="margin-bottom:10px"><b>${n0(d3)} camarões por m³</b><small>Xu et al. 2025 (Fishes, conferido), bioflocos: faixa ótima de 400 a 600 por m³ (pontos ótimos calculados 513 e 529). Acima disso a amônia e o nitrito sobem e o camarão sai menor.${fora?" Você está fora de 400–600.":""}</small></div>`})()}<p class="muted">Área ${f(t.area,1)} m² · volume ${n0(t.vol*1000)} L · ${n0(t.pls)} pós-larvas. Sem biometria, o peso segue a curva do manual (Cadastro › Tabela de ração).</p>
   <button class="btn p" type="button" data-salvar="tanque">✓ Salvar</button></div>`};
T.cadastro_faixas=()=>{const inp=(id,v,l)=>`<input id="${id}" type="number" step="any" inputmode="decimal" value="${v??""}" aria-label="${esc(l)}">`;
  return `<h2>Faixas da água</h2><p class="muted">Entre o ideal e o crítico é "atenção" (amarelo). Fora do crítico é vermelho. Valores do manual, cap. 10.</p><div class="card scroll"><table class="tbl"><tr><th>Parâmetro</th><th>Ideal mín.</th><th>Ideal máx.</th><th>Crítico abaixo de</th><th>Crítico acima de</th></tr>${PARAMS.map(p=>{const x=cfg.faixas[p.k]||{};return `<tr><td>${esc(p.n)}<div class="muted">${esc(p.u)}</div></td><td>${inp("fmin_"+p.k,x.min,"Ideal mínimo "+p.n)}</td><td>${inp("fmax_"+p.k,x.max,"Ideal máximo "+p.n)}</td><td>${inp("fcmin_"+p.k,x.cmin,"Crítico mínimo "+p.n)}</td><td>${inp("fcmax_"+p.k,x.cmax,"Crítico máximo "+p.n)}</td></tr>`}).join("")}</table>
  <div class="row" style="margin-top:10px"><button class="btn p" type="button" data-salvar="faixas">✓ Salvar</button><button class="btn" type="button" data-padrao="faixas">Voltar aos padrões</button></div></div>`};
T.cadastro_tabela=()=>{const inp=(id,v,l)=>`<input id="${id}" type="number" step="any" inputmode="decimal" value="${v??""}" aria-label="${esc(l)}">`;
  return `<h2>Tabela de ração</h2><p class="muted">Faixas do manual (cap. 8): a % vale a partir do peso indicado até a próxima linha. Linha em branco é removida.</p><div class="card scroll"><table class="tbl"><tr><th>A partir de (g)</th><th>% do peso/dia</th><th>Tratos</th></tr>${cfg.tabela.map((r,i)=>`<tr><td>${inp("tp_"+i,r[0],"Peso linha "+(i+1))}</td><td>${inp("tq_"+i,r[1],"Percentual linha "+(i+1))}</td><td>${inp("tt_"+i,r[2],"Tratos linha "+(i+1))}</td></tr>`).join("")}<tr><td>${inp("tp_new","","Novo peso")}</td><td>${inp("tq_new","","Novo percentual")}</td><td>${inp("tt_new","","Novos tratos")}</td></tr></table>
  <h3>Curva de peso esperada (g por semana de cultivo)</h3><p class="muted">Usada só enquanto não houver biometria. Semanas 0 a ${cfg.curva.length-1}, separadas por ponto e vírgula.</p><input id="curvaTxt" class="busca" style="width:100%" value="${esc(cfg.curva.map(x=>String(x).replace(".",",")).join("; "))}" aria-label="Curva de peso">
  <div class="row" style="margin-top:10px"><button class="btn p" type="button" data-salvar="tabela">✓ Salvar</button><button class="btn" type="button" data-padrao="tabela">Voltar aos padrões</button></div></div>`};
T.cadastro_doses=()=>{const v=tanque().vol;const d=cfg.doses;const row=(k,n,u,nota)=>`<tr><td>${n}<div class="muted">${nota}</div></td><td><input id="d_${k}" type="number" step="any" inputmode="decimal" value="${esc(d[k])}" aria-label="${esc(n)}"></td><td>${u}</td></tr>`;
  return `<h2>Doses de insumos</h2><p class="muted">Usadas no "Quanto aplicar hoje" do painel. Tudo por volume, sem dose fixa e sem depender da salinidade. Volume do tanque: ${f(v,1)} m³.</p><div class="card scroll"><table class="tbl"><tr><th>Insumo</th><th>Dose</th><th>Unidade</th></tr>
   ${row("azomite","Azomite na ração","g por kg de ração","Tan 2014: 2–4 g/kg funcionou. Não passe de 4.")}
   ${row("bicarb","Bicarbonato de rotina","kg por kg de ração","Manual: 0,25.")}
   ${row("alcAlvo","Alvo de alcalinidade na correção","mg/L CaCO₃","g = (alvo − medido) × m³ ÷ 0,6")}
   ${row("acucar","Açúcar contra amônia","g por (mg/L × m³)","Manual: 20 g por g de amônia-N.")}
   ${row("nutrat","Nutrat diário","mL por m³ por dia","Só Bioflocos: 1 mL/m³. O app dobra quando a química pede.")}
   ${row("simbForm","Simbiótico na formação","L por m³ por dia","Só Bioflocos: 1 L/m³ (até 2 para acelerar).")}
   ${row("farelo","Farelo de arroz fermentado (carbono principal)","kg por kg de ração","Ponto de partida: regra da Purdue de 0,5–1 kg de carbono por kg de ração, aplicada ao farelo. Ajuste pelo cone e pela amônia.")}
   ${row("odAlarme","Alarme de oxigênio","mg/L","Plano B de O₂: alarme em 4,5.")}
   ${row("cnAlvo","Relação C:N de referência","C por N","Halim et al. 2025 (bioflocos com melaço, conferido): C:N 10 deu o melhor retorno, com sobrevivência de 95% e conversão 1,58. Cao et al. 2025 cita 15 para crescimento e 20 para limpar a água (números ainda não conferidos no artigo). O app só mostra a conta; não muda o farelo sozinho.")}
   ${row("prot","Proteína da ração","% PB","Deixe vazio para o app ler do nome da ração (ex.: \"Ração 40% PB\"). Usado na conta da C:N.")}
   ${row("probBombona","Probiótico na bombona","g por bombona de 70–80 L","Só Bioflocos: 30 g. Dose da bombona, não do tanque.")}

    if((a.un==="g"&&p.unidade==="kg")||(a.un==="mL"&&p.unidade==="L"))q/=1000;out.push({data:a.data.slice(0,10),produto:p.id,qtd:q,origem:"Aplicação (Manejo)",ciclo:cicloDe(a.data.slice(0,10))})});

  const fase=!cfg.dataPovoamento?"Preparação (sem data de povoamento)":dc<0?"Preparação da água, dia "+Math.max(0,dc+21)+" de 21":"Povoado, dia "+dc+" de cultivo";
  let h=`<h2>Ciclo ${G("ciclo").length+1} · ${esc(cfg.nome||"Tanque")}</h2><div class="banner ${cfg.dataPovoamento&&dc>=0?"ok":"w"}" style="margin-bottom:12px"><b>${esc(fase)}</b><small>Tanque redondo Ø${f(cfg.diametro,1)} m × ${f(cfg.profundidade,2)} m: ${f(t.area,1)} m² e ${f(t.vol,1)} m³ (${n0(t.vol*1000)} litros) · ${n0(cfg.densidade)} PL/m²</small></div>`;
  h+=`<div class="grid">${kpi("Pós-larvas",n0(r.pl||t.pls),r.pl?"lançadas no povoamento":"previstas pelo cadastro")}${kpi("Biomassa",L?f(L.biomKg,1)+" kg":"–",L?f(L.biomKg/t.vol,2)+" kg/m³":"")}${kpi("Ração usada",f(r.racaoKg,1)+" kg",brl(r.racaoR))}${kpi("FCA",r.fca?f(r.fca,2):"–",r.kg?"pela despesca":"parcial, pela biomassa")}${kpi("Custo do ciclo",brl(r.custo),"")}${kpi("Custo por kg",r.custoKg?brl(r.custoKg):"–",r.kg?"produzido":"da biomassa atual")}${kpi("Despescado",f(r.kg,1)+" kg",r.venda?brl(r.venda):"")}${kpi("Resultado",brl(r.lucro),"",r.lucro<0?"neg":"")}</div>`;
  h+=`<h2>De onde vem o custo</h2><div class="card scroll"><table class="tbl"><tr><th>Item</th><th class="r">Quantidade</th><th class="r">R$</th></tr>
   <tr><td>Pós-larvas</td><td class="r">${n0(r.pl)}</td><td class="r">${brl(r.custoPL)}</td></tr>
   ${GRUPOS.map(g=>`<tr><td><span class="dot" style="background:${g[2]}"></span> ${esc(g[1])}</td><td class="r">${g[0]==="RACAO"?f(r.g[g[0]].q,1)+" kg":""}</td><td class="r">${brl(r.g[g[0]].r)}</td></tr>`).join("")}
   <tr><td>Despesas do tanque (energia, mão de obra…)</td><td></td><td class="r">${brl(r.fixo)}</td></tr><tr class="tot"><td>Total</td><td></td><td class="r">${brl(r.custo)}</td></tr></table></div>
   <p class="muted">A ração e os insumos entram pelo custo médio das compras no Estoque. Tratos e aplicações do Manejo baixam o estoque e somam aqui sozinhos.</p>`;
  h+=`<div class="row" style="margin-top:8px"><button class="btn p" type="button" data-acao="povoamento">Lançar povoamento</button><button class="btn" type="button" data-acao="despesca">Lançar despesca</button></div>`;
  return h};
T.producao_povoamento=()=>`<h2>Povoamento</h2>`+gradeG("povoamento",[{t:"Data",v:p=>dt(p.data)},{t:"Laboratório",v:p=>p.lab},{t:"Idade",v:p=>p.idade},{t:"PL",r:1,v:p=>n0(p.qtd)},{t:"PL/m²",r:1,v:p=>n0(p.qtd/tanque().area)},{t:"Milheiro",r:1,v:p=>brl(p.milheiro)},{t:"Total",r:1,v:p=>brl(p.valor)}],G("povoamento").filter(p=>p.ciclo===cicloAtual()),{incluir:"povoamento",vazio:"Nenhum povoamento lançado neste ciclo. O botão Povoar do Preparo só marca a data; aqui entram a quantidade e o custo."});
T.producao_despesca=()=>`<h2>Despesca</h2><div class="banner w" style="margin-bottom:10px"><b>No dia da despesca: guardar as mantas úmidas</b><small>Baixar a água para 50 cm, arrastar os difusores para um lado e tirar com puçá. As bactérias das mantas aceleram o próximo ciclo.</small></div>`+gradeG("despesca",[{t:"Data",v:d=>dt(d.data)},{t:"Tipo",v:d=>d.tipo==="TOTAL"?"Total":"Parcial",h:d=>gTag(d.tipo==="TOTAL"?"Total":"Parcial",d.tipo==="TOTAL"?"w":"ok")},{t:"Cliente",v:d=>d.cli},{t:"Kg",r:1,v:d=>f(d.kg,1)},{t:"Peso (g)",r:1,v:d=>f(d.peso,1)},{t:"R$/kg",r:1,v:d=>brl(d.preco)},{t:"Total",r:1,v:d=>brl(d.kg*d.preco)}],G("despesca").filter(d=>d.ciclo===cicloAtual()),{incluir:"despesca"});
T.producao_historico=()=>{const cs=G("ciclo").sort((a,b)=>a.fim<b.fim?1:-1);return `<h2>Histórico de ciclos</h2><p class="muted">Cada despesca total guarda o resultado do ciclo aqui, para comparar um ciclo com o outro.</p>`+gradeG("ciclos",[{t:"Ciclo",v:c=>c.numero},{t:"Povoamento",v:c=>dt(c.povoamento)},{t:"Despesca",v:c=>dt(c.fim)},{t:"Dias",r:1,v:c=>c.dias==null?"":c.dias},{t:"Kg",r:1,v:c=>f(c.kg,1)},{t:"Kg/m³",r:1,v:c=>f(c.kg/tanque().vol,2)},{t:"Peso (g)",r:1,v:c=>f(c.peso,1)},{t:"Sobrev.",r:1,v:c=>c.sobrev==null?"":f(c.sobrev,0)+"%"},{t:"FCA",r:1,v:c=>f(c.fca,2)},{t:"Custo/kg",r:1,v:c=>brl(c.custoKg)},{t:"Resultado",r:1,v:c=>brl(c.lucro)}],cs,{vazio:"Nenhum ciclo encerrado ainda. Lance uma despesca total para fechar o primeiro."})};
T.estoque_produtos=()=>{const sa=saidas();return `<h2>Produtos</h2><p class="muted">O produto do grupo Ração é a ração ativa: cada trato do Manejo baixa dele. Aplicações com o mesmo nome do produto também baixam sozinhas.</p>${(()=>{const f2=faltaProd();return f2.length?`<div class="banner w" style="margin:8px 0">Faltam ${f2.length} produtos do manejo (os mesmos do jogo): ${esc(f2.map(x=>x[0]).join(", "))}.<div class="row" style="margin-top:6px"><button type="button" class="btn p" data-semprod="1">+ Cadastrar os ${f2.length} que faltam</button></div></div>`:""})()}`+gradeG("produtos",[{t:"Produto",v:p=>p.nome,h:p=>esc(p.nome)+(prodRacao()&&prodRacao().id===p.id?" "+gTag("ração ativa","ok"):p.grupo==="RACAO"?` <button type="button" class="btn sm" data-ativa="${esc(p.id)}">Usar esta</button>`:"")},{t:"Grupo",v:p=>(GRUPOS.find(g=>g[0]===p.grupo)||[])[1]||"",h:p=>{const g=GRUPOS.find(g=>g[0]===p.grupo)||GRUPOS[3];return `<span class="dot" style="background:${g[2]}"></span> ${esc(g[1])}`}},{t:"Saldo",r:1,v:p=>f(saldoProd(p.id,sa),1)+" "+p.unidade,h:p=>{const s=saldoProd(p.id,sa);return `<span class="${s<0||(p.minimo&&s<p.minimo)?"neg":""}">${f(s,1)} ${esc(p.unidade)}</span>`}},{t:"Preço",r:1,v:p=>brl(custoMedio(p.id)),h:p=>brl(custoMedio(p.id))+(temCompra(p.id)?"":custoMedio(p.id)?" "+gTag("estimativa","w"):"")},{t:"Valor",r:1,v:p=>brl(Math.max(0,saldoProd(p.id,sa))*custoMedio(p.id))}],produtos(),{incluir:"produto",vazio:"Cadastre a ração e os insumos (Bactrat, Nutrat, farelo, Azomite, calcário…)."})};
T.estoque_entradas=()=>`<h2>Entradas</h2>`+gradeG("entradas",[{t:"Data",v:e=>dt(e.data)},{t:"Produto",v:e=>(gById(e.produto)||{}).nome||"?"},{t:"Fornecedor",v:e=>e.forn},{t:"NF",v:e=>e.nf},{t:"Qtd",r:1,v:e=>f(e.qtd,1)+" "+((gById(e.produto)||{}).unidade||"")},{t:"Unitário",r:1,v:e=>brl(e.valorUnit)},{t:"Total",r:1,v:e=>brl(e.qtd*e.valorUnit)}],G("entrada").sort((a,b)=>a.data<b.data?1:-1),{incluir:"entrada"});
T.estoque_saidas=()=>{const sa=saidas();return `<h2>Saídas</h2><p class="muted">As linhas marcadas Manejo vêm sozinhas dos tratos e das aplicações. Para corrigir, corrija o trato ou a aplicação.</p>`+gradeG("saidas",[{t:"Data",v:s=>dt(s.data)},{t:"Produto",v:s=>(gById(s.produto)||{}).nome||"?"},{t:"Origem",v:s=>s.origem,h:s=>gTag(s.origem,s.id?"":"ok")},{t:"Qtd",r:1,v:s=>f(s.qtd,s.qtd<1?3:1)+" "+((gById(s.produto)||{}).unidade||"")},{t:"Custo",r:1,v:s=>brl(s.qtd*custoMedio(s.produto))}],sa.slice(0,400),{incluir:"saida"})};
T.estoque_balancete=()=>{const sa=saidas();const r=prodRacao();const sete=sa.filter(s=>r&&s.produto===r.id&&s.data>addDias(hoje(),-7)).reduce((a,s)=>a+s.qtd,0)/7;const sr=r?saldoProd(r.id,sa):0;

  return `<h2>Balancete do estoque</h2><div class="grid">${kpi("Valor em estoque",brl(produtos().reduce((a,p)=>a+Math.max(0,saldoProd(p.id,sa))*custoMedio(p.id),0)))}${kpi("Ração em estoque",r?f(sr,1)+" kg":"–",r?esc(r.nome):"cadastre a ração")}${kpi("Consumo médio",f(sete,2)+" kg/dia","últimos 7 dias")}${kpi("Dura",sete||ped?n0(sr/(sete||ped))+" dias":"–",sete?"no ritmo atual":ped?"pela ração de hoje":"")}</div>`+
  gradeG("balancete",[{t:"Produto",v:p=>p.nome},{t:"Entradas",r:1,v:p=>f(G("entrada").filter(e=>e.produto===p.id).reduce((a,e)=>a+e.qtd,0),1)},{t:"Saídas",r:1,v:p=>f(sa.filter(s=>s.produto===p.id).reduce((a,s)=>a+s.qtd,0),1)},{t:"Saldo",r:1,v:p=>f(saldoProd(p.id,sa),1)+" "+p.unidade},{t:"Mínimo",r:1,v:p=>p.minimo?f(p.minimo,1):""},{t:"Situação",v:p=>{const s=saldoProd(p.id,sa);return s<0?"Negativo":p.minimo&&s<p.minimo?"Comprar":"OK"},h:p=>{const s=saldoProd(p.id,sa);return s<0?gTag("Negativo","w"):p.minimo&&s<p.minimo?gTag("Comprar","w"):gTag("OK","ok")}}],produtos(),{semDel:1})};
function gContas(id,tipo){const l=G("conta").filter(c=>c.tipo===tipo).sort((a,b)=>(a.pagoEm?1:0)-(b.pagoEm?1:0)||(a.venc<b.venc?1:-1));
  return gradeG(id,[{t:"Vencimento",v:c=>dt(c.venc),h:c=>`<span class="${!c.pagoEm&&c.venc<hoje()?"neg":""}">${dt(c.venc)}</span>`},{t:"Descrição",v:c=>c.descricao},{t:"Pessoa",v:c=>c.pessoa},{t:"Origem",v:c=>c.origem,h:c=>gTag(c.origem)+(c.custo?" "+gTag("custo","w"):"")},{t:"Valor",r:1,v:c=>brl(c.valor)},{t:"Baixa",v:c=>c.pagoEm?dt(c.pagoEm):"Em aberto",h:c=>c.pagoEm?`<span class="muted">${dt(c.pagoEm)}</span> <button class="btn sm" type="button" data-estornar="${esc(c.id)}">Desfazer</button>`:`<button class="btn sm p" type="button" data-baixar="${esc(c.id)}">Baixa</button>`}],l,{incluir:tipo==="PAGAR"?"pagar":"receber",total:`<td colspan="4">Total em aberto</td><td class="r">${brl(l.filter(contaAberta).reduce((a,c)=>a+c.valor,0))}</td><td></td><td></td>`})}
T.financeiro_pagar=()=>`<h2>Contas a pagar</h2>`+gContas("pagar","PAGAR");
T.financeiro_receber=()=>`<h2>Contas a receber</h2>`+gContas("receber","RECEBER");
T.financeiro_caixa=()=>{const mv=G("conta").filter(c=>c.pagoEm).sort((a,b)=>a.pagoEm<b.pagoEm?-1:1);let s=cfg.saldoInicial||0;const rows=mv.map(c=>{s+=(c.tipo==="RECEBER"?1:-1)*c.valor;return Object.assign({},c,{_s:s})}).reverse();
  const ap=G("conta").filter(c=>c.tipo==="PAGAR"&&!c.pagoEm).reduce((a,c)=>a+c.valor,0),ar=G("conta").filter(c=>c.tipo==="RECEBER"&&!c.pagoEm).reduce((a,c)=>a+c.valor,0);
  return `<h2>Caixa</h2><div class="grid">${kpi("Saldo em caixa",brl(saldoCaixa()),"",saldoCaixa()<0?"neg":"")}${kpi("A receber",brl(ar))}${kpi("A pagar",brl(ap))}${kpi("Saldo previsto",brl(saldoCaixa()+ar-ap),"se tudo for pago")}</div>
  <div class="row" style="margin:10px 0"><label class="muted" for="saldoIni">Saldo inicial</label><input id="saldoIni" class="busca" type="number" inputmode="decimal" step="any" value="${cfg.saldoInicial||0}" style="width:120px"><button class="btn sm" type="button" id="btnSaldoIni">Salvar</button></div>`+
  gradeG("caixa",[{t:"Data",v:c=>dt(c.pagoEm)},{t:"Descrição",v:c=>c.descricao},{t:"Entrada",r:1,v:c=>c.tipo==="RECEBER"?brl(c.valor):""},{t:"Saída",r:1,v:c=>c.tipo==="PAGAR"?brl(c.valor):""},{t:"Saldo",r:1,v:c=>brl(c._s)}],rows,{semDel:1,vazio:"Nenhuma baixa ainda."})};
function rentab(){const r=resultado();const e=cfg.eco||DEFAULTS.eco;const dc=diaCultivo();const dias=dc!=null&&dc>=0?dc+1:0;const kwhDia=(e.kw||0)*24;const energia=kwhDia*dias*(e.tarifa||0);
  const L=cfg.dataPovoamento?lote(hoje()):null;const preco=e.preco||precoVendaRef(cfg.pesoAlvo);const custoHoje=r.custo+energia;const kgHoje=r.kg+(L?L.biomKg:0);
  let prev=null;if(L&&L.vivos>0){const dCurva=w=>{let d=0;while(d<400&&curva(d)<w)d++;return d};const diasRest=Math.max(0,dCurva(cfg.pesoAlvo)-dCurva(L.peso));const kgFim=L.vivos*Math.max(L.peso,cfg.pesoAlvo)/1000;const ganho=Math.max(0,kgFim-L.biomKg);
    const rac=prodRacao();const pRac=rac?custoMedio(rac.id):PRECO_REF["Ração 40% PB"];const racaoRest=ganho*cfg.fcr*pRac;const insDia=dias>0?r.insumos/dias:0;const insRest=insDia*diasRest;const enRest=kwhDia*(e.tarifa||0)*diasRest;
    const custo=custoHoje+racaoRest+insRest+enRest;const kg=r.kg+kgFim;const receita=r.venda+kgFim*preco;prev={diasRest,kg,custo,receita,margem:receita-custo,racaoRest,insRest,enRest,custoKg:kg?custo/kg:0}}
  return{r,e,dias,energia,preco,custoHoje,kgHoje,custoKgHoje:kgHoje?custoHoje/kgHoje:0,prev,estimado:produtos().some(p=>!temCompra(p.id)&&custoMedio(p.id)>0)}}
T.financeiro_rentab=()=>{const x=rentab(),p=x.prev,e=x.e;const cor=v=>v>=0?"ok":"bad";
  return `<h2>Rentabilidade do ciclo <span class="ev camp">estimativa</span></h2>
  <div class="grid">${kpi("Custo até hoje",brl(x.custoHoje),"com energia "+brl(x.energia))}${kpi("Custo por kg hoje",x.custoKgHoje?brl(x.custoKgHoje):"–",f(x.kgHoje,1)+" kg no tanque e despescado")}${p?kpi("Receita prevista",brl(p.receita),f(p.kg,1)+" kg a "+brl(x.preco)+"/kg")+kpi("Custo previsto",brl(p.custo),"até a despesca, em ~"+n0(p.diasRest)+" dias")+kpi("Margem do ciclo",brl(p.margem),p.receita?f(p.margem/p.receita*100,0)+"% da receita":"",cor(p.margem))+kpi("Custo por kg previsto",brl(p.custoKg),"empata vendendo a esse preço"):""}</div>
  ${p?`<div class="card" style="margin-top:12px"><b>O que ainda entra no custo até a despesca</b><div class="muted">Ração: ${brl(p.racaoRest)} (ganho de peso que falta × conversão ${f(cfg.fcr,1)} do Cadastro × preço da ração). Insumos: ${brl(p.insRest)} (no ritmo dos dias já lançados). Energia: ${brl(p.enRest)}. A previsão usa a biomassa do app (vivos × peso), o peso alvo de ${f(cfg.pesoAlvo,0)} g e os dias que faltam pela curva de crescimento do Cadastro.</div></div>`:`<p class="muted">Lance o povoamento para ver a previsão de receita e margem.</p>`}
  ${x.estimado?`<div class="banner w" style="margin-top:12px"><b>Parte dos preços é estimativa</b><small>Produto sem compra lançada usa o preço de referência do app (o mesmo do simulador). Lance as compras em Estoque › Entradas para o custo ficar real.</small></div>`:""}
  <div class="card" style="margin-top:12px"><b>Seus números</b>
   <div class="fg" style="margin-top:8px"><div class="f"><label for="e_preco">Preço de venda (R$ por kg)</label><input id="e_preco" type="number" inputmode="decimal" step="any" value="${e.preco??""}" placeholder="${precoVendaRef(cfg.pesoAlvo)} (estimativa)"></div>
   <div class="f"><label for="e_kw">Potência do soprador (kW)</label><input id="e_kw" type="number" inputmode="decimal" step="any" value="${e.kw??""}"></div>
   <div class="f"><label for="e_tar">Tarifa de energia (R$ por kWh)</label><input id="e_tar" type="number" inputmode="decimal" step="any" value="${e.tarifa??""}"></div></div>
   <div class="muted">Energia: potência × 24 h × dias de cultivo × tarifa. Os padrões (0,75 kW e R$ 0,85) são estimativa. Se você já lança a conta de luz em Financeiro › a Pagar como custo do ciclo, ponha 0 na potência para não contar duas vezes. Preço de venda em branco usa a referência por tamanho: até 10 g R$ 22, até 12 g R$ 26, até 15 g R$ 30, até 18 g R$ 34.</div>
   <div class="row" style="margin-top:10px"><button class="btn p" type="button" data-salvar="eco">✓ Salvar</button></div></div>`};
T.financeiro_custos=()=>{const r=resultado();const pre=cfg.dataPovoamento?lote(hoje()):null;
  const precoAlvo=(r.custoKg||0);return T.financeiro_rentab()+`<h2>Custo do ciclo e preço mínimo</h2><div class="grid">${kpi("Custo até hoje",brl(r.custo))}${kpi("Custo por kg",r.custoKg?brl(r.custoKg):"–",r.kg?"despescado":"biomassa atual")}${kpi("Custo por m³",brl(r.custo/tanque().vol),f(tanque().vol,1)+" m³")}${kpi("Ração no custo",r.custo?f(r.racaoR/r.custo*100,0)+"%":"–","")}</div>
  <div class="card" style="margin-top:12px"><b>Preço mínimo de venda</b><div class="muted">Para empatar, cada kg precisa sair por pelo menos ${precoAlvo?brl(precoAlvo):"– (lance compras e povoamento)"}${pre?`. Na despesca prevista (${f(pre.vivos*cfg.pesoAlvo/1000,1)} kg a ${f(cfg.pesoAlvo,0)} g), o custo cai porque a biomassa cresce mais que o gasto.`:"."}</div></div>`+T.producao_ciclo().split("<h2>De onde vem o custo</h2>")[1].replace(/^/,"<h2>De onde vem o custo</h2>").split('<div class="row" style="margin-top:8px">')[0]};

/* ---------- mapa 3D do tanque redondo (igual ao mapa do oProdutor, para 1 tanque) ---------- */
let C3=null;
function situacaoTanque(){const al=alertas();if(!cfg.dataPovoamento||diaCultivo()<0)return["prep","Preparação","#2f55d4"];if(al.some(a=>a[0]==="bad"))return["alerta","Alerta (água)","#d6342c"];
  const um=addDias(hoje(),-3);if(tipo("mortalidade").some(m=>m.data.slice(0,10)>=um))return["mort","Alerta de mortalidade","#127a74"];
  const d=[1,2,3].map(i=>tratosDoDia(addDias(hoje(),-i)).reduce((s,r)=>s+(r.qtd||0),0));if(d[0]&&d[1]&&d[2]&&d[0]<d[1]&&d[1]<d[2])return["queda","Ração em queda","#f08a3b"];
  if(al.some(a=>a[0]==="w"))return["aten","Atenção","#e0a020"];return["ok","Povoado · tudo ok","#2e7d32"]}
function cena3d(show){const box=$("#cena");if(!box)return;box.style.display=show?"block":"none";if(!show){if(C3)C3.on=false;return}
  if(!window.THREE){$("#side").innerHTML=`<div class="muted">Mapa 3D indisponível sem internet</div>`;return}
  if(!C3)C3=montar3d();C3.on=true;C3.atualizar();if(!C3.loop)C3.tick()}
function montar3d(){const cv=$("#cv"),T3=window.THREE;const R=new T3.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  const scene=new T3.Scene(),cam=new T3.PerspectiveCamera(42,1,0.1,200);scene.add(new T3.HemisphereLight(0xdff4ff,0x3a4a2a,0.75));const sun=new T3.DirectionalLight(0xffffff,0.7);sun.position.set(8,14,6);scene.add(sun);
  const chao=new T3.Mesh(new T3.CircleGeometry(30,48),new T3.MeshLambertMaterial({color:0x6f8a52}));chao.rotation.x=-Math.PI/2;scene.add(chao);
  const piso=new T3.Mesh(new T3.CircleGeometry(4.6,48),new T3.MeshLambertMaterial({color:0xb9b2a4}));piso.rotation.x=-Math.PI/2;piso.position.y=0.01;scene.add(piso);

function proximos7(){const out=[];const hj=hoje();const dc0=diaCultivo(hj);
  for(let i=1;i<=7;i++){const d=addDias(hj,i);const dc=diaCultivo(d);
    if(dc===0)out.push([d,"🐟","Dia 21 do preparo: povoar","Só com todos os critérios verdes em Apto a povoar?"]);
    if(dc!=null&&dc<0&&dc>=-21)PREP.filter(p=>p[0]===dc).forEach(p=>out.push([d,"🧪",p[2],"Preparo dia "+(dc+21)]));
    if(dc!=null&&dc>0&&dc%7===0)out.push([d,"⚖️","Biometria da semana "+dc/7,"Pesar 50 a 100 camarões"]);
    const jm=janelaMuda(toDate(d)),jm0=janelaMuda(toDate(addDias(d,-1)));if(jm.on&&!jm0.on)out.push([d,"🌕","Começa a janela da "+jm.qual,"±2 dias: OD ≥ 5,5, ração −20%, Azomite"]);
    if(dc!=null&&dc>0){const a=pesoEstimado(addDias(d,-1)).p,b=pesoEstimado(d).p;const la=linhaTabela(a),lb=linhaTabela(b);if(la[0]!==lb[0])out.push([d,"📈",`Ração muda de faixa: ${f(lb[1],1)}% da biomassa`,`Peso estimado passa de ${f(lb[0],1)} g`]);
      if(a<cfg.pesoAlvo*0.66&&b>=cfg.pesoAlvo*0.66)out.push([d,"🧺","Avaliar despesca parcial","Peso estimado chega a 2/3 da meta; alivia a biomassa"])}

  else{R.forEach(([o,id])=>recsAll.push(Object.assign({id:id||("ex"+Math.random().toString(36).slice(2,10))},o)));Gs.forEach(([o,id])=>gest.push(Object.assign({id:id||("gex"+Math.random().toString(36).slice(2,10))},o)));sortRecs(recsAll);lsSet("bf_recs",recsAll);lsSet("bf_gest",gest);filt();render()}}
